# Конфиг self-host LiveKit-сервера для ЛОКАЛЬНОЙ разработки.
# Монтируется в контейнер (см. docker-compose.yml, сервис livekit).

# Порт сигналинга (WebSocket + HTTP). Сюда стучится браузер и наш бэк.
port: 7880

rtc:
  # TCP-порт для WebRTC, когда UDP недоступен (фолбэк).
  tcp_port: 7881

  # Диапазон UDP-портов для самого медиа-потока (видео/звук).
  # Держим маленьким — для локального теста хватает; каждый порт надо пробросить в Docker.
  port_range_start: 50000
  port_range_end: 50010

  # НЕ пытаться определять внешний IP через STUN — мы локально.
  use_external_ip: false

  # Ключевая строка. Сервер сообщает браузеру этот IP как адрес для медиа.
  # Внутри Docker без неё сервер назвал бы свой внутренний IP (172.x) —
  # браузер на хосте до него не достучится → видео не пойдёт.
  # 127.0.0.1 = "шли на localhost", Docker пробросит внутрь контейнера.
  # При реальном деплое здесь будет публичный IP машины.
  node_ip: 127.0.0.1

# Определение "кто говорит" (индикатор-рамка на плитке участника).
# Настроено на РЕЗКУЮ бинарную реакцию: горит/не горит, без плавного нарастания.
audio:
  # Порог громкости (0-127, где 0 — самый громкий). Тише порога = "молчит".
  active_level: 30
  # Какой % интервалов в окне должен превышать порог, чтобы считаться говорящим.
  min_percentile: 15
  # Как часто (мс) сервер пересчитывает и рассылает "кто говорит". Меньше = отзывчивее.
  update_interval: 100
  # Сглаживание по числу интервалов. 1 = НЕ сглаживать → жёсткое горит/не горит.
  smooth_intervals: 1

# Пары api-key: secret. Этими ключами наш бэк будет подписывать токены доступа.
# Секрет должен совпадать с LIVEKIT_API_SECRET в server/.env.
# Только для локалки — в прод такой секрет не тащим.
keys:
  telemost: 08a47c869150b98b807c9fc0ad6b58bf73884534d6fcfefdf1105e3a8f6289c1
